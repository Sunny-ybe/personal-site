<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portfolio.bot · Build It By Talking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --paper:#F7F4EE;--desk:#ECE7DE;--ink:#1C1B19;--muted:#8A857C;--accent:#3B6FE0;--logo:#E0763B;
  --glass:rgba(255,255,255,0.72);--line:rgba(28,27,25,0.08);--brand:#3B6FE0;
  --shadow:0 30px 60px -20px rgba(28,27,25,0.18),0 0 0 1px rgba(28,27,25,0.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;overflow:hidden;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;background:#111}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;background:var(--paper);overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;overflow:hidden}
.layer.on{opacity:1;visibility:visible}
.cam{position:absolute;inset:0;transform-origin:960px 220px;will-change:transform}
.fill{position:absolute;inset:0}
.h{opacity:0;visibility:hidden}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.row-c{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center}
.ch{display:none}
.caret{display:inline-block;width:4px;background:var(--ink);border-radius:2px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.paused *{animation-play-state:paused!important}

/* Scene 1 / title cards */
#s1text{top:440px;height:80px;font:600 64px/80px 'Inter Tight',Inter,sans-serif;letter-spacing:-.02em;white-space:pre}
#s1text .caret{height:64px;margin-left:6px}
.tagpill{font:400 22px Inter;color:var(--muted);padding:10px 22px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(28,27,25,.12);background:rgba(255,255,255,.45)}
.title80{font:600 80px 'Inter Tight',Inter,sans-serif;letter-spacing:-.02em}

/* Desktop */
.wall{position:absolute;inset:0;background:radial-gradient(1100px 760px at 72% 24%,#F5F0E8 0%,rgba(245,240,232,0) 70%),radial-gradient(900px 700px at 10% 94%,#E2DACD 0%,rgba(226,218,205,0) 70%),var(--desk)}
.menubar{position:absolute;left:0;top:0;right:0;height:36px;display:flex;align-items:center;gap:20px;padding:0 22px;font:600 15px Inter;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 1px 0 var(--line)}
.mb-logo{width:16px;height:16px;border-radius:50%;border:3.5px solid var(--ink)}
.mb-right{margin-left:auto;font-weight:500}
.dock{position:absolute;left:680px;top:962px;width:560px;height:88px;border-radius:26px;display:flex;align-items:center;gap:14px;padding:0 14px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 24px 40px -20px rgba(28,27,25,.3),0 0 0 1px rgba(28,27,25,.07)}
.app{width:64px;height:64px;border-radius:16px;position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 4px 8px -4px rgba(0,0,0,.25)}
.app::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
.app i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.g-ring{width:28px;height:28px;border-radius:50%;border:4px solid #fff}
.g-lines{width:28px;height:20px;border-radius:2px;background:linear-gradient(#fff 0 4px,transparent 4px 8px,#fff 8px 12px,transparent 12px 16px,#fff 16px 20px)}
.g-sq{width:26px;height:26px;border-radius:7px;border:4px solid #fff}
.g-half{width:30px;height:15px;border-radius:15px 15px 0 0;background:#fff}
.g-dots{width:24px;height:24px;background:radial-gradient(circle,#fff 4.5px,transparent 5px) 0 0/12px 12px}
.g-tri{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:26px solid #fff}
.app.pb{background:linear-gradient(#5A88EE,#3463D6)}
.app.pb svg{position:absolute;inset:0}
.dockdot{position:absolute;left:511px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.55}

/* File icons */
.ficon{position:absolute;width:210px;display:flex;flex-direction:column;align-items:center;transform-origin:105px 40px}
.ficon.dim{opacity:.6;transform:scale(.86)}
.fsel{position:absolute;left:2px;right:2px;top:-8px;bottom:-6px;border-radius:12px;background:rgba(59,111,224,.13);box-shadow:inset 0 0 0 1.5px rgba(59,111,224,.32);opacity:0}
.docw{position:relative;filter:drop-shadow(0 6px 8px rgba(28,27,25,.13)) drop-shadow(0 0 1px rgba(28,27,25,.35))}
.doc{position:relative;width:64px;height:80px;background:#fff;border-radius:6px;clip-path:polygon(0 0,70% 0,100% 22%,100% 100%,0 100%)}
.doc::after{content:'';position:absolute;right:0;top:0;width:30%;height:22%;background:linear-gradient(225deg,transparent 50%,#E2DCD0 50%)}
.doc i{position:absolute;left:11px;height:4px;border-radius:2px;background:#E6E1D7}
.doc .thumb{position:absolute;left:9px;right:9px;top:13px;height:34px;border-radius:4px;display:block;overflow:hidden}
.thumb u{position:absolute;left:6px;bottom:4px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid #fff;opacity:.85}
.thumb s{position:absolute;left:50%;top:50%;margin:-6px 0 0 -4px;width:0;height:0;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ext{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:700 14px/1 Inter;color:#fff;padding:3px 6px;border-radius:5px}
.fname{position:relative;margin-top:10px;max-width:200px;font:400 14px/1.35 'JetBrains Mono',monospace;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Folder */
.folderI{position:absolute;left:850px;top:430px;width:220px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
.fglyph{width:150px;height:118px;filter:drop-shadow(0 14px 18px rgba(44,89,194,.25));transform-origin:50% 60%}
.flabel{margin-top:12px;font:400 16px 'JetBrains Mono',monospace;white-space:pre;height:24px;line-height:24px}

/* Windows */
.wtb{height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);position:relative;background:rgba(244,242,237,.9)}
.dots{display:flex;gap:8px;position:relative;z-index:1}
.dots i{width:12px;height:12px;border-radius:50%;background:#D8D3C9}
.wtitle{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:8px;font:500 15px Inter;color:var(--muted)}
.pbmini{width:18px;height:18px;border-radius:5px;background:linear-gradient(#5A88EE,#3463D6);display:inline-block;position:relative}
.pbmini::after{content:'';position:absolute;left:4px;top:6px;width:10px;height:7px;border-radius:1.5px;background:#fff}
.appwin{position:absolute;left:700px;top:370px;width:520px;height:340px;border-radius:16px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--shadow);overflow:hidden}
.awc{padding:42px 34px 0}
.aq{font:600 28px/1.2 'Inter Tight',Inter,sans-serif;letter-spacing:-.02em;text-align:center}
.asub{font:400 16px Inter;color:var(--muted);text-align:center;margin-top:10px}
.abtns{display:flex;gap:16px;margin-top:44px}
.abtn{flex:1;height:52px;border-radius:12px;background:#F4F1EB;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font:500 17px Inter;position:relative;overflow:hidden}
.abtn .hl{position:absolute;inset:0;background:var(--brand);color:#fff;display:grid;place-items:center;opacity:0}
.tip{position:absolute;left:1062px;top:446px;padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);font:500 17px/1.4 Inter;white-space:nowrap}
.tip::before{content:'';position:absolute;left:-7px;top:24px;width:14px;height:14px;background:rgba(255,255,255,.8);transform:rotate(45deg);box-shadow:-1px 1px 0 rgba(28,27,25,.06)}
.tip span{color:var(--muted);font-weight:400}
.lasso{position:absolute;left:150px;top:110px;width:640px;height:580px;background:rgba(59,111,224,.07);border:1.5px solid rgba(59,111,224,.55);border-radius:3px;transform-origin:0 0}
.stack{position:absolute;width:90px;height:100px}
.stk{position:absolute;inset:0;transform-origin:30% 30%;opacity:.94}
.stk .docw{position:absolute;left:10px;top:6px}
.stk .s1{transform:rotate(-9deg) translate(-7px,3px)}
.stk .s2{transform:rotate(6deg) translate(7px,0)}
.badge{position:absolute;right:-8px;top:-10px;min-width:32px;height:32px;padding:0 9px;border-radius:16px;background:#E5484D;color:#fff;font:700 17px/32px Inter;text-align:center;box-shadow:0 4px 10px rgba(229,72,77,.35)}

/* Ghost builder */
.ghost{position:absolute;left:1020px;top:190px;width:780px;height:540px;border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden;filter:blur(4px)}
.gside{position:absolute;left:0;top:44px;bottom:0;width:230px;border-right:1px solid var(--line);padding:18px;background:#FBFAF7}
.gside h4{margin:0 0 14px;font:600 16px Inter}
.gitem{height:32px;border-radius:8px;background:#F0ECE5;margin-bottom:8px}
.gsl{margin-top:18px;font:500 14px Inter;color:var(--muted)}
.gtrack{height:4px;background:#E5E0D6;border-radius:2px;margin-top:12px;position:relative}
.gknob{position:absolute;top:-6px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 2px 4px rgba(0,0,0,.15)}
.gcanvas{position:absolute;left:250px;right:20px;top:64px;bottom:20px}
.gblk{border:2px dashed #D9D3C8;border-radius:10px;margin-bottom:14px}
.gbtns{position:absolute;right:14px;top:7px;display:flex;gap:8px;z-index:2}
.gbtn{font:500 14px Inter;padding:6px 12px;border-radius:8px;background:#EFECE6}
.gbtn.pri{background:var(--ink);color:#fff}

/* Notifications */
.notif{position:absolute;left:1444px;top:52px;width:420px;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.ni{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font-size:24px;flex:none}
.nb{flex:1;min-width:0}
.nh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nt{font:600 17px/1.3 Inter}
.nw{font:400 14px Inter;color:var(--muted);flex:none}
.ns{font:400 15px/1.4 Inter;color:var(--muted);margin-top:3px}
.ns.mono{font-family:'JetBrains Mono',monospace;color:var(--brand)}
.nbar{height:6px;border-radius:3px;background:rgba(28,27,25,.08);margin-top:10px;overflow:hidden}
.nfill{height:100%;width:100%;background:var(--brand);transform-origin:0 50%;transform:scaleX(0)}
.ring{position:absolute;inset:-5px;border-radius:23px;box-shadow:0 0 0 2px rgba(59,111,224,.45),0 0 40px 6px rgba(59,111,224,.28);opacity:0;pointer-events:none}

/* Browser */
.browser{position:absolute;border-radius:14px;overflow:hidden;background:#FDFCFA;box-shadow:var(--shadow);transform-origin:0 0}
.tb{height:52px;background:#F4F2ED;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;position:relative}
.addr{position:absolute;left:50%;top:10px;margin-left:-260px;width:520px;height:32px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font:400 15px 'JetBrains Mono',monospace}
.bbody{position:absolute;top:52px;left:0;right:0;bottom:0;overflow:hidden;background:#FDFCFA}
.toast{position:absolute;top:10px;padding:0 14px;height:32px;border-radius:999px;display:flex;align-items:center;gap:8px;font:500 14px Inter;box-shadow:0 0 0 1px var(--line),0 10px 20px -12px rgba(28,27,25,.3)}
.gdot{width:8px;height:8px;border-radius:50%;background:#2FB36B;box-shadow:0 0 0 3px rgba(47,179,107,.2)}

/* Site */
.site{position:absolute;inset:0;--acc:#3B6FE0;background:#FDFCFA}
.sec{position:absolute;left:0;right:0;height:0}
.flipw{position:absolute;left:0;right:0;top:0}
.nav{position:absolute;left:230px;right:230px;top:28px;height:44px;display:flex;align-items:center;gap:14px}
.sun{width:40px;height:40px;position:relative;flex:none}
.sun::before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(var(--logo) 0 10deg,transparent 10deg 30deg);-webkit-mask:radial-gradient(circle closest-side,transparent 0 54%,#000 56% 98%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 0 54%,#000 56% 98%,transparent 100%)}
.sun::after{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--logo)}
.navname{font:600 18px Inter}
.navlinks{margin-left:auto;display:flex;gap:28px;align-items:center;font:500 16px Inter;color:var(--muted)}
.navcta{color:#fff;background:var(--acc);padding:9px 18px;border-radius:999px}
#bHero{position:absolute;left:0;right:0;top:0;height:330px}
.hname{position:absolute;left:228px;top:118px;margin:0;font:600 72px/1 'Inter Tight',Inter,sans-serif;letter-spacing:-.02em}
.htag{position:absolute;left:230px;top:210px;margin:0;font:400 26px Inter;color:var(--muted)}
.htag b{font-weight:500;color:var(--ink)}
.hbtns{position:absolute;left:230px;top:268px;display:flex;gap:12px}
.btnA{background:var(--acc);color:#fff;font:600 16px Inter;padding:12px 22px;border-radius:999px}
.btnG{font:500 16px Inter;padding:12px 22px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(28,27,25,.14)}
.lbl{font:600 14px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.xp{position:absolute;left:230px;top:0;width:640px}
.xp .lbl{margin-bottom:18px}
.xline{position:absolute;left:145px;top:74px;width:2px;height:144px;background:var(--acc);opacity:.3}
.xrow{display:grid;grid-template-columns:140px 32px 1fr;align-items:center;height:72px;position:relative}
.yr{font:400 15px 'JetBrains Mono',monospace;color:var(--muted)}
.xdot{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 16%,#FDFCFA)}
.xt{font:600 22px Inter}
.xsep,.xc{font:400 19px Inter;color:var(--muted);white-space:pre}
.vid{position:absolute;left:950px;top:0;width:520px}
.vid .lbl{margin-bottom:16px}
.thumbV{position:relative;width:520px;height:292px;border-radius:16px;overflow:hidden;background:linear-gradient(140deg,#3A3644,#1F1D24)}
.slide{position:absolute;left:60px;top:46px;width:400px;height:200px;border-radius:10px;background:#F7F4EE}
.slide b{position:absolute;display:block;border-radius:6px}
.sbar{bottom:24px;width:40px;background:var(--acc);border-radius:6px 6px 0 0!important}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.play::after{content:'';position:absolute;left:26px;top:20px;border-left:18px solid var(--ink);border-top:12px solid transparent;border-bottom:12px solid transparent}
.shim{position:absolute;top:0;left:0;width:200px;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.25),rgba(255,255,255,0));opacity:0}
.vbadge{position:absolute;left:14px;top:14px;padding:8px 14px;border-radius:999px;font:600 14px Inter;display:flex;gap:8px;align-items:center;color:#fff}
.vb1{background:rgba(20,19,24,.62)}
.vb2{background:var(--acc)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .9s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(28,27,25,.18);border-top-color:var(--ink);width:18px;height:18px}
.hstrip{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.16)}
.tick{position:absolute;bottom:0;width:34px;height:6px;background:var(--acc)}
.vt{font:600 22px Inter;margin-top:16px}
.vs{font:400 16px Inter;color:var(--muted);margin-top:6px}
.em{position:absolute;left:230px;top:0;width:1240px;background:#FDFCFA;box-shadow:0 0 0 24px #FDFCFA}
.emh{display:flex;justify-content:space-between;align-items:flex-end;height:104px}
.emt{font:600 36px/1.1 'Inter Tight',Inter,sans-serif;letter-spacing:-.02em;margin-top:8px}
.emd{font:400 18px Inter;color:var(--muted);margin-top:8px}
.emlink{font:600 16px Inter;color:var(--acc);padding-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:20px}
.tile{height:230px;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--line),0 16px 30px -18px rgba(28,27,25,.25)}
.tile b{position:absolute;display:block}

/* Chat bar */
.chat{position:absolute;left:320px;top:694px;width:1060px;height:64px;border-radius:16px;display:flex;align-items:center;gap:14px;padding:0 12px 0 22px;box-shadow:var(--shadow)}
.cfocus{position:absolute;inset:-3px;border-radius:19px;box-shadow:0 0 0 3px rgba(59,111,224,.28);opacity:0}
.cicon{font-size:20px;color:var(--brand);flex:none}
.cin{position:relative;flex:1;height:100%;display:flex;align-items:center;font:400 21px Inter;white-space:pre;overflow:hidden}
.cin .caret{width:2px;height:26px;margin-left:1px}
.ph{position:absolute;left:0;color:var(--muted)}
.cspin{position:absolute;left:0;display:flex;gap:12px;align-items:center;color:var(--muted)}
.csend{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 18px Inter;flex:none}

/* Mail, sheet, dashboard */
.mailwin{position:absolute;left:110px;top:90px;width:1120px;height:720px;border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden;filter:blur(3px);opacity:.8}
.mlist{position:absolute;left:0;top:44px;bottom:0;width:340px;border-right:1px solid var(--line);background:#FBFAF7}
.mrow{height:84px;border-bottom:1px solid var(--line);padding:16px 20px}
.mrow.sel{background:rgba(59,111,224,.1)}
.mrow b{display:block;font:600 16px Inter}
.mrow span{display:block;font:400 15px Inter;color:var(--muted);margin-top:6px}
.mread{position:absolute;left:340px;top:44px;right:0;bottom:0;padding:40px 48px}
.msubj{font:600 34px 'Inter Tight',Inter,sans-serif;letter-spacing:-.02em}
.mfrom{display:flex;gap:14px;align-items:center;margin-top:22px;font:500 17px Inter}
.mfrom small{display:block;font:400 15px Inter;color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 16px Inter;color:#fff;background:linear-gradient(135deg,#9A7BD8,#6A5BCB);flex:none}
.mline{height:10px;border-radius:5px;background:#ECE8E0;margin-top:16px}
.matt{display:inline-flex;margin-top:30px;padding:12px 16px;border-radius:10px;box-shadow:0 0 0 1px var(--line);font:400 15px 'JetBrains Mono',monospace}
.sheet{position:absolute;left:150px;top:80px;width:1560px;height:840px;border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden;filter:blur(6px);opacity:.7}
.sgrid{position:absolute;left:0;right:0;top:44px;bottom:0;background:linear-gradient(rgba(28,27,25,.07) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(28,27,25,.07) 1px,transparent 1px) 0 0/150px 100%}
.sgrid b{position:absolute;display:block;height:8px;border-radius:4px}
.dash{position:absolute;left:340px;top:110px;width:1240px;height:730px;border-radius:16px;background:#FDFCFA;box-shadow:var(--shadow);overflow:hidden}
.dside{position:absolute;left:0;top:44px;bottom:0;width:260px;background:#F5F2EC;border-right:1px solid var(--line);padding:22px 18px}
.dbrand{display:flex;align-items:center;gap:10px;font:600 17px Inter;margin-bottom:22px}
.ditem{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 12px;border-radius:10px;font:500 16px Inter;color:var(--muted)}
.ditem.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ddot{width:8px;height:8px;border-radius:50%;background:var(--brand)}

<script>
/* ================= Timeline ================= */
function bez(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
  return p=>{ if(p<=0)return 0; if(p>=1)return 1; let t=p;
    for(let i=0;i<8;i++){const x=sx(t)-p; if(Math.abs(x)<1e-6)return sy(t); const d=dx(t); if(Math.abs(d)<1e-6)break; t-=x/d;}
    let lo=0,hi=1; t=p; for(let i=0;i<40;i++){const x=sx(t); if(Math.abs(x-p)<1e-6)break; if(p>x)lo=t; else hi=t; t=(lo+hi)/2;}
    return sy(t); };
}
const E=bez(.22,1,.36,1);
gsap.ticker.lagSmoothing(0);
const tl=gsap.timeline({paused:true});
const DUR=82;

function F(el,from,to,t){ if(!el){console.warn('missing target at',t);return;} tl.fromTo(el,from,Object.assign({duration:.6,ease:E},to,{immediateRender:false}),t); }
const fin=(el,t,d=.5,fr={},to={})=>F(el,Object.assign({autoAlpha:0},fr),Object.assign({autoAlpha:1,duration:d},to),t);
const fout=(el,t,d=.4,fr={},to={})=>F(el,Object.assign({autoAlpha:1},fr),Object.assign({autoAlpha:0,duration:d},to),t);
const cut=(el,t,on)=>F(el,{autoAlpha:on?0:1},{autoAlpha:on?1:0,duration:0},t);
const dof=(el,t,on,d=.7)=>F(el,{filter:on?'blur(0px)':'blur(6px)',opacity:on?1:.7},{filter:on?'blur(6px)':'blur(0px)',opacity:on?.7:1,duration:d,ease:'sine.inOut'},t);
function makeChars(el,text){ el.textContent=''; return [...text].map(c=>{const s=document.createElement('span'); s.className='ch'; s.textContent=c; el.appendChild(s); return s;}); }
const on=(s,t)=>F(s,{display:'none'},{display:'inline',duration:0},t);
const off=(s,t)=>F(s,{display:'inline'},{display:'none',duration:0},t);
function typeOn(sp,t,per){ sp.forEach((s,i)=>on(s,t+i*per)); return t+sp.length*per; }
function typeOff(sp,t,per){ [...sp].reverse().forEach((s,i)=>off(s,t+i*per)); }
function pos(el,root){ let x=0,y=0,e=el; while(e&&e!==root){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;} return {x,y,w:el.offsetWidth,h:el.offsetHeight,cx:x+el.offsetWidth/2,cy:y+el.offsetHeight/2}; }

<script>
/* ================= Music (Web Audio, procedural) ================= */
const Music={
  ctx:null,bus:null,timer:null,
  init(){
    if(this.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const C=this.ctx=new AC();
    this.master=C.createGain(); this.master.gain.value=0.0001;
    const comp=C.createDynamicsCompressor(); comp.threshold.value=-20; comp.knee.value=18; comp.ratio.value=3; comp.attack.value=.01; comp.release.value=.3;
    this.master.connect(comp); comp.connect(C.destination);
    this.rev=C.createConvolver(); this.rev.buffer=this.impulse(3.6);
    const rg=C.createGain(); rg.gain.value=.5; this.rev.connect(rg); rg.connect(this.master);
    const nb=C.createBuffer(1,Math.floor(C.sampleRate*.4),C.sampleRate), d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.noise=nb;
  },
  impulse(sec){ const C=this.ctx,len=Math.floor(C.sampleRate*sec),b=C.createBuffer(2,len,C.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);} return b; },
  start(t){
    this.init(); if(!this.ctx) return; const C=this.ctx; if(C.state!=='running') C.resume();
    this.stop();
    this.bus=C.createGain(); this.bus.connect(this.master);
    this.send=C.createGain(); this.send.gain.value=.55; this.send.connect(this.rev);
    this.lp=C.createBiquadFilter(); this.lp.type='lowpass'; this.lp.frequency.value=1200; this.lp.Q.value=.5;
    this.lp.connect(this.bus); this.lp.connect(this.send);
    this.f0=t; this.a0=C.currentTime+.06;
    this.nextChord=Math.floor(t/4); this.nextE=Math.ceil(t*3-1e-6);
    this.tick(); this.timer=setInterval(()=>this.tick(),25);
  },
  stop(){
    clearInterval(this.timer); this.timer=null;
    const C=this.ctx; if(!C||!this.bus) return;
    const b=this.bus,s=this.send,now=C.currentTime;
    [b,s].forEach(g=>{g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value,now); g.gain.linearRampToValueAtTime(0,now+.12);});
    setTimeout(()=>{try{b.disconnect();s.disconnect();}catch(e){}},400);
    this.bus=null; this.send=null;
  },
  ft(){ return this.f0+(this.ctx.currentTime-this.a0); },
  at(f){ return this.a0+(f-this.f0); },
  tick(){
    if(!this.bus) return;
    const C=this.ctx, now=C.currentTime, f=this.ft(), H=Math.min(f+.25,DUR);
    while(this.nextChord*4<H){ this.chord(this.nextChord); this.nextChord++; }
    while(this.nextE/3<H){
      const tt=this.nextE/3;
      if(tt>=f-.03&&(inPerc(tt))){
        const a=Math.max(now,this.at(tt));
        if(this.nextE%2===0) this.kick(a,(this.nextE/2)%2===0?1:.75); else this.hat(a);
      }
      this.nextE++;
    }
    let g=.8;
    if(inSwell(f)) g*=1.22;                      // swell
    if(f>DUR-2) g*=Math.max(0,(DUR-f)/2);          // fade out over the last 2s
    if(window.speechSynthesis&&speechSynthesis.speaking) g*=.4;   // ≈ -8 dB duck
    this.master.gain.setTargetAtTime(Math.max(g,.0001),now,.12);
    if(f>DUR+1) this.stop();
  },
  chord(ci){
    const C=this.ctx, now=C.currentTime;
    const CH=[[48,55,60,64],[43,55,59,62],[45,57,60,64],[41,57,60,65]];   // I  V  vi  IV (C major)
    const notes=CH[ci>=Math.floor((DUR-.01)/4)?0:ci%4];                                          // last chord resolves to I
    let s=this.at(ci*4), e=this.at(Math.min(ci*4+4,DUR)), att=1.6;
    if(s<now){ s=now+.01; att=.8; }
    if(e<=s+.15) return;
    att=Math.min(att,(e-s)*.8);
    notes.forEach((m,k)=>{
      const fq=440*Math.pow(2,(m-69)/12), peak=k===0?.075:.045;
      const g=C.createGain();
      g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(peak,s+att);
      g.gain.setValueAtTime(peak,e); g.gain.setTargetAtTime(0,e,1.0);
      g.connect(this.lp);
      [['sine',-6,1],['triangle',6,.55]].forEach(([type,dt,lv])=>{
        const o=C.createOscillator(); o.type=type; o.frequency.value=fq; o.detune.value=dt;
        const og=C.createGain(); og.gain.value=lv; o.connect(og); og.connect(g); o.start(s); o.stop(e+6);
      });
    });
  },
  kick(a,v){
    const C=this.ctx,o=C.createOscillator(),g=C.createGain();
    o.frequency.setValueAtTime(110,a); o.frequency.exponentialRampToValueAtTime(42,a+.18);
    g.gain.setValueAtTime(.0001,a); g.gain.exponentialRampToValueAtTime(.5*v,a+.006); g.gain.exponentialRampToValueAtTime(.0001,a+.36);
    o.connect(g); g.connect(this.bus); o.start(a); o.stop(a+.4);
  },
  hat(a){
    const C=this.ctx,s=C.createBufferSource(),hp=C.createBiquadFilter(),g=C.createGain();
    s.buffer=this.noise; hp.type='highpass'; hp.frequency.value=7500;
    g.gain.setValueAtTime(.0001,a); g.gain.exponentialRampToValueAtTime(.05,a+.004); g.gain.exponentialRampToValueAtTime(.0001,a+.06);
    s.connect(hp); hp.connect(g); g.connect(this.bus); s.start(a); s.stop(a+.08);
  }
};

/* ================= Voiceover (Web Speech) ================= */
const synth=window.speechSynthesis||null;
let voice=null, voOn=true, ccOn=true, playing=false, started=false;
function pickVoice(){
  if(!synth) return; const vs=synth.getVoices(); if(!vs.length) return;
  for(const n of ['Samantha','Ava','Google US English','Microsoft Aria']){ const v=vs.find(v=>v.name.includes(n)); if(v){voice=v;return;} }
  voice=vs.find(v=>v.lang==='en-US')||vs.find(v=>(v.lang||'').startsWith('en'))||null;
}
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function speak(i){
  if(!synth||!voOn||!playing) return;
  const L=LINES[i], u=new SpeechSynthesisUtterance(L[2]||L[1].replace('<br>',' '));
  if(voice) u.voice=voice; u.lang='en-US'; u.rate=.95; u.pitch=1;
  synth.speak(u);
}
const hush=()=>{ if(synth) synth.cancel(); };

/* ================= Playback + controls ================= */
const stage=$('#stage'), ctr=$('#controls'), scrub=$('#scrub'), timeEl=$('#time'), bPlay=$('#bPlay');
const ICON_PLAY='<svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg width="18" height="18" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg>';
const fmt=s=>{s=Math.max(0,Math.min(DUR,s)); const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+String(r).padStart(2,'0');};
function syncUI(){ const t=tl.time(); if(!scrubbing) scrub.value=t; timeEl.textContent=fmt(t)+' / '+fmt(DUR); bPlay.innerHTML=playing?ICON_PAUSE:ICON_PLAY; }
function play(){
  if(tl.time()>=DUR-.01) tl.seek(0);
  playing=true; $('#endUI').classList.remove('show'); $('#bReplay').classList.remove('show');
  stage.classList.remove('paused'); hush(); tl.play(); Music.start(tl.time()); syncUI();
}
function pause(){ playing=false; tl.pause(); hush(); Music.stop(); stage.classList.add('paused'); syncUI(); }
function seekTo(t){ hush(); tl.seek(t); if(playing) Music.start(t); syncUI(); }
function ended(){ playing=false; stage.classList.add('paused'); hush(); $('#endUI').classList.add('show'); $('#bReplay').classList.add('show'); syncUI(); }
function replay(){ tl.seek(0); play(); }

let scrubbing=false, wasPlaying=false;
scrub.addEventListener('pointerdown',()=>{ scrubbing=true; wasPlaying=playing; if(playing) pause(); });
scrub.addEventListener('input',()=>{ seekTo(parseFloat(scrub.value)); });
const endScrub=()=>{ if(!scrubbing) return; scrubbing=false; if(wasPlaying&&tl.time()<DUR-.01) play(); };
scrub.addEventListener('pointerup',endScrub); scrub.addEventListener('change',endScrub);
bPlay.addEventListener('click',()=>playing?pause():play());
$('#bReplay').addEventListener('click',replay);
$('#replayBig').addEventListener('click',replay);
$('#bCC').addEventListener('click',e=>{ ccOn=!ccOn; e.currentTarget.classList.toggle('on',ccOn); $('#caps').classList.toggle('off',!ccOn); });
$('#bVO').addEventListener('click',e=>{ voOn=!voOn; e.currentTarget.classList.toggle('on',voOn); if(!voOn) hush(); });
document.addEventListener('keydown',e=>{ if(!started) return; if(e.code==='Space'){ e.preventDefault(); playing?pause():play(); } });

let hideT=null;
function poke(){ if(!started) return; ctr.classList.add('show'); clearTimeout(hideT); hideT=setTimeout(()=>{ if(!ctr.matches(':hover')&&!scrubbing) ctr.classList.remove('show'); },2000); }
['mousemove','pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev,poke,{passive:true}));

function fit(){ const s=Math.min(innerWidth/1920,innerHeight/1080); stage.style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();

/* ================= Init ================= */
buildDOM2();
let built=false;
function ready(){
  if(built) return; built=true;
  buildTimeline();
  tl.eventCallback('onUpdate',syncUI);
  tl.eventCallback('onComplete',ended);
  scrub.max=DUR; tl.seek(0); syncUI();
  $('#playBig').disabled=false;
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(ready);
setTimeout(ready,3000);
$('#playBig').addEventListener('click',()=>{
  if(!built) return;
  started=true; $('#start').classList.add('gone');
  Music.init(); if(Music.ctx) Music.ctx.resume();
  pickVoice();
  play(); poke();
});
</script>
</body>
</html>
